# Chạy test và build SUpload.exe trên Windows. Tải file zip ở mục Artifacts của lần chạy.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller
      - name: Chạy test (bỏ qua test giao diện vì máy CI không có Chromium)
        run: python -m pytest --ignore=tests/test_e2e.py
      - name: Build SUpload.exe
        run: pyinstaller packaging/supload.spec --noconfirm
      - name: Chạy thử bản đóng gói
        shell: pwsh
        run: |
          $env:SUPLOAD_HOME = "$env:RUNNER_TEMP\supload-data"
          $p = Start-Process dist\SUpload\SUpload.exe -ArgumentList "--no-browser" -PassThru
          Start-Sleep -Seconds 8
          $r = Invoke-WebRequest http://127.0.0.1:5050/api/state -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "Bản đóng gói không chạy được" }
          (Invoke-WebRequest http://127.0.0.1:5050/ -UseBasicParsing).Content | Select-String "SUpload"
          Stop-Process -Id $p.Id -Force
      - name: Nén
        run: Compress-Archive -Path dist\SUpload -DestinationPath dist\SUpload-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SUpload-windows
          path: dist/SUpload-windows.zip
